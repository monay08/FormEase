{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="fw-bold text-dark">Forms</h2>
  <a href="{{ url_for('create_form') }}" class="btn btn-primary btn-lg shadow-sm">
    <i class="bi bi-plus-circle-fill"></i> Create Form
  </a>
</div>

<div class="row">
  {% for f in forms %}
  <div class="col-sm-6 col-md-4 mb-4">
    <div class="card h-100 shadow-sm border-0 app-card">
      <div class="card-body d-flex flex-column">
        
        <h5 class="card-title fw-bolder text-primary mb-1">{{ f['title'] }}</h5>
        
        <p class="card-text text-muted mb-3">
          <small>
            Show score after submit: 
            <strong class="{{ 'text-success' if f['show_score'] else 'text-danger' }}">
              {{ 'Yes' if f['show_score'] else 'No' }}
            </strong>
          </small>
        </p>
        
        <div class="mt-auto pt-3 border-top">
          {% if f['created_by'] == session['user_id'] %}
            <a href="{{ url_for('view_form', form_id=f['id']) }}" class="btn btn-outline-secondary btn-sm me-1 mb-1">
              <i class="bi bi-eye"></i> Preview
            </a>
            <a href="{{ url_for('view_responses', form_id=f['id']) }}" class="btn btn-success btn-sm me-1 mb-1">
              <i class="bi bi-bar-chart-fill"></i> Responses
            </a>
            <form action="{{ url_for('delete_form', form_id=f['id']) }}" method="POST" style="display:inline;">
              <button class="btn btn-danger btn-sm mb-1" type="submit" onclick="return confirm('Are you sure you want to delete this form and all its responses?');">
                <i class="bi bi-trash"></i> Delete
              </button>
            </form>
          {% else %}
            <a href="{{ url_for('view_form', form_id=f['id']) }}" class="btn btn-primary btn-sm w-100">
              <i class="bi bi-pencil-square"></i> Answer Form
            </a>
          {% endif %}
        </div>
        
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
