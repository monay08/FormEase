{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-lg p-4 app-card">
      <div class="card-body">
        <h3 class="card-title text-center mb-4 fw-bold text-primary">Login to FormEase</h3>
        
        <form method="POST">
          <div class="mb-3">
            <label for="username" class="form-label fw-bold">Username</label>
            <input type="text" name="username" id="username" class="form-control form-control-lg" placeholder="Enter your username" required>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label fw-bold">Password</label>
            <input type="password" name="password" id="password" class="form-control form-control-lg" placeholder="Enter your password" required>
          </div>
          <div class="d-grid gap-2">
            <button class="btn btn-primary btn-lg" type="submit">
              <i class="bi bi-box-arrow-in-right"></i> Login
            </button>
          </div>
          <p class="text-center mt-4 mb-0">
            No account yet? <a href="{{ url_for('register') }}" class="text-decoration-none fw-bold">Register here</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
