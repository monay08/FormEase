{% extends "base.html" %}
{% block content %}

<h2 class="text-center mb-4 text-primary fw-bold">Create a New Form</h2>

<form method="POST" class="app-card p-4 shadow-lg">

  <div class="mb-5 border-bottom pb-3">
    <label for="formTitle" class="form-label fs-5 fw-bold text-muted">Form Title</label>
    <input type="text" name="title" id="formTitle" class="form-control form-control-lg" placeholder="e.g., Final Exam, Satisfaction Survey" required>
  </div>

  <div id="questions">
    </div>
  
  <hr class="my-4">

  <div class="row align-items-center">
    <div class="col-md-8">
      <div class="form-check form-switch fs-5">
        <input class="form-check-input" type="checkbox" id="show_score" name="show_score" checked>
        <label class="form-check-label" for="show_score">
          **Show score and correct answers after submit**
        </label>
      </div>
    </div>
    
    <div class="col-md-4 text-md-end mt-3 mt-md-0">
      <button type="button" class="btn btn-outline-secondary me-2" onclick="addQuestion()">
        <i class="bi bi-plus-circle-fill"></i> Add Question
      </button>
      <button type="submit" class="btn btn-success">
        <i class="bi bi-check-circle-fill"></i> Create Form
      </button>
    </div>
  </div>
</form>

<div class="mt-4 text-center">
    <a class="btn btn-primary" href="{{ url_for('index') }}">
        <i class="bi bi-arrow-left"></i> Back to Forms
    </a>
</div>

<script>
let qCount = 0;

function generateQuestionHtml(count) {
  // Use a card structure for better visual separation of each question
  return `
    <div class="card shadow-sm mb-4 border-secondary border-opacity-25" data-q-id="${count}">
      <div class="card-header bg-light d-flex justify-content-between align-items-center">
        <strong class="fs-5 text-dark">Question ${count}</strong>
        <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.card').remove(); updateQuestionNumbers()">
          <i class="bi bi-trash"></i> Remove
        </button>
      </div>
      <div class="card-body">
        
        <div class="mb-3">
          <label class="form-label fw-bold">Question Text</label>
          <input type="text" name="question" class="form-control" placeholder="What is the capital of France?" required>
        </div>

        <div class="row g-3">
            
          <div class="col-md-6">
            <label class="form-label fw-bold">Question Type</label>
            <select name="type" class="form-select" onchange="toggleOptions(this)">
              <option value="short">Short Answer</option>
              <option value="multiple">Multiple choice</option>
              <option value="checkbox">Checkboxes (multiple answers)</option>
            </select>
          </div>
          
          <div class="col-md-6">
            <label class="form-label fw-bold">Points for this question</label>
            <input type="number" name="score" class="form-control" placeholder="Points" min="0" step="0.1" value="1" required>
          </div>

        </div>

        <hr class="my-3">
        
        <div class="options-container mb-3" style="display: none;">
            <label class="form-label fw-bold text-info">Options (For Multiple Choice/Checkboxes)</label>
            <input type="text" name="options" class="form-control" placeholder="Option A, Option B, Option C (comma-separated)">
        </div>
        
        <div class="mb-1">
            <label class="form-label fw-bold text-success">Correct Answer(s)</label>
            <input type="text" name="correct" class="form-control" placeholder="The correct answer (comma-separated for checkboxes)">
        </div>

      </div>
    </div>
  `;
}

function addQuestion() {
  qCount++;
  const container = document.getElementById('questions');
  const div = document.createElement('div');
  div.innerHTML = generateQuestionHtml(qCount).trim();
  container.appendChild(div.firstChild);
  
  // Initialize the display state for the new question
  const selectElement = container.lastElementChild.querySelector('select[name="type"]');
  toggleOptions(selectElement); // Set initial state
}

function toggleOptions(sel) {
  // Find the closest card and then find the options-container inside it
  const cardBody = sel.closest('.card-body');
  const optionsContainer = cardBody.querySelector('.options-container');

  if (sel.value === 'short') {
    optionsContainer.style.display = 'none';
    optionsContainer.querySelector('input[name="options"]').value = ''; // Clear options if switching to short answer
  } else {
    optionsContainer.style.display = 'block';
  }
}

// Function to re-index the question numbers after deletion
function updateQuestionNumbers() {
    const questionCards = document.querySelectorAll('#questions .card');
    questionCards.forEach((card, index) => {
        const newNumber = index + 1;
        card.querySelector('.card-header strong').textContent = `Question ${newNumber}`;
    });
}

// Initial call to add the first question on page load
addQuestion();
</script>
{% endblock %}
